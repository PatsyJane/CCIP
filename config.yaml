# CCIP LangGraph Anomaly Detection Workflow — configuration
# (spec: ccip-langgraph-anomaly, Requirement 1)
#
# Structural thresholds, RobustSTL/STL parameters, and workflow settings live
# here. Sensitive and environment-specific values use ${VAR_NAME} placeholders
# that are injected from the process environment (loaded from `.env` via
# python-dotenv) at load time. ${VAR:-default} supplies a fallback when VAR is
# absent. Required placeholders that resolve empty abort the run with a
# ConfigError naming the variable (Req 1.3).
#
# Secrets (llm_api_key, smtp_password) are stored on a repr-redacted field and
# never appear in logs or node output (Req 1.5). Do NOT hard-code secrets here.

# --- Account-level anomaly detection thresholds (Req 6) ---
detection:
  # Cold Start (<30 days): flag when |today - prev non-anomaly day| exceeds this.
  cold_start_absolute_threshold: ${CCIP_COLD_START_ABS_THRESHOLD:-20.0}
  # Statistical method for Initial/Beginner/Normal modes: "iqr" or "sigma".
  statistical_method: ${CCIP_STAT_METHOD:-iqr}
  iqr_factor: ${CCIP_IQR_FACTOR:-1.5}      # residual > Q3 + factor*IQR
  sigma_factor: ${CCIP_SIGMA_FACTOR:-3.0}  # residual > mean + factor*std

# --- RobustSTL / statsmodels STL parameters (Req 5.4) ---
stl:
  period: ${CCIP_STL_PERIOD:-7}      # weekly seasonality for daily cost data
  seasonal: ${CCIP_STL_SEASONAL:-7}  # seasonal smoother length (odd, >= 7)
  robust: ${CCIP_STL_ROBUST:-true}

# --- Ingestion (Req 3.1, 13, 15, 16) ---
ingestion:
  # Rolling_History_Window length (days) + the span of a FULL pull. 90 covers
  # Normal mode. The persisted history is trimmed to this many most-recent days.
  history_days: ${CCIP_HISTORY_DAYS:-90}
  # Default Target_Date offset: a run with no explicit date evaluates D-N. 2 (D-2)
  # skips the still-settling "yesterday" of AWS CUR data (Req 13).
  target_date_offset_days: ${CCIP_TARGET_DATE_OFFSET_DAYS:-2}
  # Steady-state trailing window merged into the persisted history (Req 16.1):
  # 2 => the Target_Date and the day before it.
  trailing_fetch_days: ${CCIP_TRAILING_FETCH_DAYS:-2}
  # Cadence (days) of the periodic FULL reconciliation pull that REPLACES the
  # persisted history to self-heal drift (Req 16.4).
  reconciliation_interval_days: ${CCIP_RECONCILIATION_INTERVAL_DAYS:-7}

# --- LLM narrative (Gemini via LangChain) (Req 9.4) ---
llm:
  model: ${CCIP_LLM_MODEL:-gemini-2.5-flash-lite}
  api_key: ${CCIP_LLM_API_KEY}   # REQUIRED secret (injected from .env)

# --- Email alert (SMTP) (Req 9.5) ---
email:
  from: ${CCIP_EMAIL_FROM:-ccip-alerts@localhost}
  to: ${CCIP_EMAIL_TO:-ccip-alerts@localhost}
  # Separate operations recipient for terminal failure-notification alerts
  # (Req 12.8). Blank => the failure alert dry-runs (log only, no send).
  failure_to: ${CCIP_ALERT_FAILURE_TO:-}
  smtp_host: ${CCIP_SMTP_HOST:-}       # blank => dry run (log, no send)
  smtp_port: ${CCIP_SMTP_PORT:-587}    # 587 STARTTLS, 465 implicit TLS
  smtp_username: ${CCIP_SMTP_USERNAME:-}
  smtp_password: ${CCIP_SMTP_PASSWORD:-}  # Gmail App Password (secret)

# --- Fetch retry: transient Cost_API failures only (Req 12.1-12.3) ---
# Bounded exponential backoff with jitter, applied ONLY to unreachable-source
# Phase-1 fetch failures. Deterministic errors (invalid-parameter / missing-data
# / unexpected-error) are never retried. Each attempt is still bounded by the
# shared 30s HttpClient timeout; backoff sleeps occur only BETWEEN attempts.
retry:
  max_attempts: ${CCIP_RETRY_MAX_ATTEMPTS:-3}   # total attempts incl. the first
  base_delay: ${CCIP_RETRY_BASE_DELAY:-1.0}     # seconds; first backoff
  max_delay: ${CCIP_RETRY_MAX_DELAY:-30.0}      # seconds; backoff cap
  multiplier: ${CCIP_RETRY_MULTIPLIER:-2.0}     # exponential growth factor
  jitter: ${CCIP_RETRY_JITTER:-true}            # randomize each delay

# --- Persistent metadata store (Req 5.1, 14) ---
# Increment 2 partitions the store per account into
# <metadata_dir>/ccip_metadata_<account_name>_<account_id>.json. ``metadata_path``
# is the legacy single-file path, retained for backward compatibility.
storage:
  metadata_path: ${CCIP_METADATA_PATH:-ccip_metadata.json}
  metadata_dir: ${CCIP_METADATA_DIR:-metadata}
